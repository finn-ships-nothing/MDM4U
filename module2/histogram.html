<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histogram Demonstration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .histogram-container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 8px;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: bold;
        }

        select,
        input[type="number"] {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        input[type="range"] {
            width: 220px;
        }

        .bin-size-display {
            font-weight: bold;
            min-width: 60px;
        }

        .chart-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        svg {
            display: block;
            width: 100%;
            min-width: 650px;
            height: 500px;
        }

        .bar {
            fill: #4c78a8;
            stroke: #2f5f8f;
            stroke-width: 1;
        }

        .bar:hover {
            fill: #28527a;
        }

        .axis-line {
            stroke: #333;
            stroke-width: 1.5;
        }

        .grid-line {
            stroke: #ddd;
            stroke-width: 1;
        }

        .axis-label {
            font-size: 14px;
            fill: #333;
        }

        .tick-label {
            font-size: 12px;
            fill: #555;
        }

        .bar-label {
            font-size: 12px;
            fill: #222;
            text-anchor: middle;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        .stat {
            min-width: 120px;
        }

        .stat-name {
            font-size: 13px;
            color: #666;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
        }

        .error {
            color: #b00020;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="histogram-container">

    <h1>Histogram Demonstration</h1>

    <div class="controls">

        <div class="control">
            <label for="dataset-select">
                Dataset
            </label>

            <select id="dataset-select"></select>
        </div>


        <div class="control">
            <label for="bin-size">
                Bin size
            </label>

            <div>
                <input
                    type="range"
                    id="bin-size"
                    min="1"
                    max="50"
                    step="1"
                    value="10"
                >

                <span
                    class="bin-size-display"
                    id="bin-size-display"
                >
                    10
                </span>
            </div>
        </div>


        <div class="control">
            <label for="bin-size-number">
                Exact bin size
            </label>

            <input
                type="number"
                id="bin-size-number"
                min="0.01"
                step="0.01"
                value="10"
            >
        </div>

    </div>


    <div id="error-message" class="error"></div>


    <div class="chart-wrapper">
        <svg id="histogram"></svg>
    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-name">
                Number of values
            </div>

            <div
                class="stat-value"
                id="count-stat"
            >
                —
            </div>
        </div>


        <div class="stat">
            <div class="stat-name">
                Minimum
            </div>

            <div
                class="stat-value"
                id="min-stat"
            >
                —
            </div>
        </div>


        <div class="stat">
            <div class="stat-name">
                Maximum
            </div>

            <div
                class="stat-value"
                id="max-stat"
            >
                —
            </div>
        </div>


        <div class="stat">
            <div class="stat-name">
                Mean
            </div>

            <div
                class="stat-value"
                id="mean-stat"
            >
                —
            </div>
        </div>

    </div>

</div>


<script>

/*
===========================================================
    DATASETS
===========================================================

    Add your own datasets here.

    Each dataset is simply an array of numbers.

    Example:

    "My Dataset": [
        12, 15, 18, 21, 22,
        25, 25, 26, 30, 32
    ]

    You can have as many datasets as you want.
*/

const datasets = {

    "Normal-ish": [
        12, 15, 18, 19, 20, 21, 21, 22,
        23, 23, 24, 24, 25, 25, 25, 26,
        26, 27, 27, 28, 28, 29, 30, 30,
        31, 32, 33, 34, 35, 36, 38, 40
    ],

    "Right Skewed": [
        2, 3, 3, 4, 5, 5, 6, 7,
        7, 8, 9, 10, 12, 13, 15,
        17, 20, 23, 27, 32, 40, 55
    ],

    "Bimodal": [
        10, 11, 11, 12, 12, 13, 13, 14,
        14, 15, 15, 16, 17,

        40, 41, 41, 42, 42, 43, 44,
        44, 45, 46, 46, 47
    ]

};


/*
===========================================================
    ELEMENTS
===========================================================
*/

const svg = document.getElementById("histogram");

const datasetSelect =
    document.getElementById("dataset-select");

const binSizeSlider =
    document.getElementById("bin-size");

const binSizeNumber =
    document.getElementById("bin-size-number");

const binSizeDisplay =
    document.getElementById("bin-size-display");

const errorMessage =
    document.getElementById("error-message");

const countStat =
    document.getElementById("count-stat");

const minStat =
    document.getElementById("min-stat");

const maxStat =
    document.getElementById("max-stat");

const meanStat =
    document.getElementById("mean-stat");


/*
===========================================================
    CONFIGURATION
===========================================================
*/

const chartWidth = 900;
const chartHeight = 500;

const margin = {
    top: 30,
    right: 30,
    bottom: 70,
    left: 70
};

const plotWidth =
    chartWidth - margin.left - margin.right;

const plotHeight =
    chartHeight - margin.top - margin.bottom;


/*
===========================================================
    INITIALIZE DATASET SELECTOR
===========================================================
*/

for (const name in datasets) {

    const option =
        document.createElement("option");

    option.value = name;
    option.textContent = name;

    datasetSelect.appendChild(option);
}


/*
===========================================================
    GET CURRENT DATASET
===========================================================
*/

function getCurrentDataset() {

    return datasets[datasetSelect.value];

}


/*
===========================================================
    CREATE HISTOGRAM BINS
===========================================================

    For example, with:

        binSize = 10

    We might get:

        0  - 10
        10 - 20
        20 - 30
        30 - 40

===========================================================
*/

function makeBins(data, binSize) {

    const minimum =
        Math.min(...data);

    const maximum =
        Math.max(...data);


    /*
        Align the first bin to a multiple
        of the bin size.

        Example:

        minimum = 17
        binSize = 10

        first bin = 10
    */

    const firstBin =
        Math.floor(minimum / binSize) * binSize;


    const lastBin =
        Math.ceil(maximum / binSize) * binSize;


    const bins = [];


    for (
        let start = firstBin;
        start < lastBin;
        start += binSize
    ) {

        const end =
            start + binSize;


        const count =
            data.filter(value => {

                /*
                    The final bin includes its
                    upper boundary so that the
                    maximum value isn't lost.
                */

                if (end >= lastBin) {

                    return value >= start &&
                           value <= end;

                }

                return value >= start &&
                       value < end;

            }).length;


        bins.push({
            start: start,
            end: end,
            count: count
        });

    }


    /*
        If the data contains only one unique
        value, create one bin.
    */

    if (bins.length === 0) {

        bins.push({
            start: firstBin,
            end: firstBin + binSize,
            count: data.length
        });

    }


    return bins;

}


/*
===========================================================
    FORMAT NUMBERS
===========================================================
*/

function formatNumber(value) {

    if (Number.isInteger(value)) {
        return value.toString();
    }

    return value.toFixed(2);

}


/*
===========================================================
    UPDATE STATISTICS
===========================================================
*/

function updateStatistics(data) {

    const minimum =
        Math.min(...data);

    const maximum =
        Math.max(...data);

    const sum =
        data.reduce(
            (total, value) => total + value,
            0
        );

    const mean =
        sum / data.length;


    countStat.textContent =
        data.length;

    minStat.textContent =
        formatNumber(minimum);

    maxStat.textContent =
        formatNumber(maximum);

    meanStat.textContent =
        formatNumber(mean);

}


/*
===========================================================
    DRAW HISTOGRAM
===========================================================
*/

function drawHistogram() {

    errorMessage.textContent = "";


    const data =
        getCurrentDataset();


    /*
        Make sure the dataset is valid.
    */

    if (
        !Array.isArray(data) ||
        data.length === 0
    ) {

        errorMessage.textContent =
            "This dataset contains no values.";

        return;

    }


    /*
        Make sure all values are numbers.
    */

    if (
        data.some(
            value =>
                typeof value !== "number" ||
                !Number.isFinite(value)
        )
    ) {

        errorMessage.textContent =
            "The dataset contains an invalid value.";

        return;

    }


    let binSize =
        Number(binSizeNumber.value);


    if (
        !Number.isFinite(binSize) ||
        binSize <= 0
    ) {

        errorMessage.textContent =
            "Bin size must be greater than zero.";

        return;

    }


    const bins =
        makeBins(data, binSize);


    /*
        Clear the previous chart.
    */

    svg.innerHTML = "";


    /*
        Set SVG dimensions.
    */

    svg.setAttribute(
        "viewBox",
        `0 0 ${chartWidth} ${chartHeight}`
    );


    /*
        Find the largest bin.

        This determines the Y-axis scale.
    */

    const maximumCount =
        Math.max(
            ...bins.map(bin => bin.count)
        );


    /*
        Add a little space above the
        highest bar.
    */

    const yMaximum =
        Math.max(
            1,
            Math.ceil(maximumCount * 1.1)
        );


    /*
        X-axis conversion.

        Converts a data value into
        an SVG x-coordinate.
    */

    const minimumX =
        bins[0].start;

    const maximumX =
        bins[bins.length - 1].end;


    function xScale(value) {

        return margin.left +
            (
                (value - minimumX) /
                (maximumX - minimumX)
            ) *
            plotWidth;

    }


    /*
        Y-axis conversion.
    */

    function yScale(value) {

        return margin.top +
            plotHeight -
            (
                value / yMaximum
            ) *
            plotHeight;

    }


    /*
    =======================================================
        GRID LINES
    =======================================================
    */

    const gridGroup =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    /*
        Pick a reasonable number of Y-axis
        divisions.
    */

    const yStep =
        Math.max(
            1,
            Math.ceil(yMaximum / 5)
        );


    for (
        let value = 0;
        value <= yMaximum;
        value += yStep
    ) {

        const y =
            yScale(value);


        const line =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        line.setAttribute(
            "x1",
            margin.left
        );

        line.setAttribute(
            "x2",
            chartWidth - margin.right
        );

        line.setAttribute(
            "y1",
            y
        );

        line.setAttribute(
            "y2",
            y
        );

        line.setAttribute(
            "class",
            "grid-line"
        );


        gridGroup.appendChild(line);


        /*
            Y-axis label.
        */

        const text =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );

        text.setAttribute(
            "x",
            margin.left - 10
        );

        text.setAttribute(
            "y",
            y + 4
        );

        text.setAttribute(
            "text-anchor",
            "end"
        );

        text.setAttribute(
            "class",
            "tick-label"
        );

        text.textContent = value;

        gridGroup.appendChild(text);

    }


    svg.appendChild(gridGroup);


    /*
    =======================================================
        BARS
    =======================================================
    */

    const barGroup =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    for (const bin of bins) {

        const x =
            xScale(bin.start);

        const nextX =
            xScale(bin.end);

        const width =
            nextX - x;


        const y =
            yScale(bin.count);

        const height =
            margin.top +
            plotHeight -
            y;


        const bar =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "rect"
            );


        bar.setAttribute(
            "x",
            x
        );

        bar.setAttribute(
            "y",
            y
        );

        bar.setAttribute(
            "width",
            Math.max(0, width - 1)
        );

        bar.setAttribute(
            "height",
            height
        );

        bar.setAttribute(
            "class",
            "bar"
        );


        /*
            Browser tooltip.

            Hovering over a bin will show:

            10–20
            Count: 7
        */

        const tooltip =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "title"
            );

        tooltip.textContent =
            `${formatNumber(bin.start)}–${formatNumber(bin.end)}\n` +
            `Count: ${bin.count}`;

        bar.appendChild(tooltip);


        barGroup.appendChild(bar);


        /*
            Count above each bar.
        */

        if (bin.count > 0) {

            const label =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );

            label.setAttribute(
                "x",
                x + width / 2
            );

            label.setAttribute(
                "y",
                y - 6
            );

            label.setAttribute(
                "class",
                "bar-label"
            );

            label.textContent =
                bin.count;

            barGroup.appendChild(label);

        }

    }


    svg.appendChild(barGroup);


    /*
    =======================================================
        AXES
    =======================================================
    */

    const axisGroup =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    /*
        X-axis
    */

    const xAxis =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    xAxis.setAttribute(
        "x1",
        margin.left
    );

    xAxis.setAttribute(
        "x2",
        chartWidth - margin.right
    );

    xAxis.setAttribute(
        "y1",
        margin.top + plotHeight
    );

    xAxis.setAttribute(
        "y2",
        margin.top + plotHeight
    );

    xAxis.setAttribute(
        "class",
        "axis-line"
    );

    axisGroup.appendChild(xAxis);


    /*
        Y-axis
    */

    const yAxis =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    yAxis.setAttribute(
        "x1",
        margin.left
    );

    yAxis.setAttribute(
        "x2",
        margin.left
    );

    yAxis.setAttribute(
        "y1",
        margin.top
    );

    yAxis.setAttribute(
        "y2",
        margin.top + plotHeight
    );

    yAxis.setAttribute(
        "class",
        "axis-line"
    );

    axisGroup.appendChild(yAxis);


    /*
    =======================================================
        X-AXIS LABELS
    =======================================================
    */

    for (const bin of bins) {

        const x =
            xScale(bin.start);

        const label =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        label.setAttribute(
            "x",
            x
        );

        label.setAttribute(
            "y",
            margin.top + plotHeight + 22
        );

        label.setAttribute(
            "text-anchor",
            "middle"
        );

        label.setAttribute(
            "class",
            "tick-label"
        );

        label.textContent =
            formatNumber(bin.start);

        axisGroup.appendChild(label);

    }


    /*
        Last X-axis value.
    */

    const finalLabel =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );


    finalLabel.setAttribute(
        "x",
        xScale(maximumX)
    );

    finalLabel.setAttribute(
        "y",
        margin.top + plotHeight + 22
    );

    finalLabel.setAttribute(
        "text-anchor",
        "middle"
    );

    finalLabel.setAttribute(
        "class",
        "tick-label"
    );

    finalLabel.textContent =
        formatNumber(maximumX);

    axisGroup.appendChild(finalLabel);


    /*
    =======================================================
        AXIS TITLES
    =======================================================
    */

    /*
        X-axis title
    */

    const xTitle =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

    xTitle.setAttribute(
        "x",
        chartWidth / 2
    );

    xTitle.setAttribute(
        "y",
        chartHeight - 15
    );

    xTitle.setAttribute(
        "text-anchor",
        "middle"
    );

    xTitle.setAttribute(
        "class",
        "axis-label"
    );

    xTitle.textContent =
        "Value";

    axisGroup.appendChild(xTitle);


    /*
        Y-axis title
    */

    const yTitle =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

    yTitle.setAttribute(
        "x",
        18
    );

    yTitle.setAttribute(
        "y",
        chartHeight / 2
    );

    yTitle.setAttribute(
        "text-anchor",
        "middle"
    );

    yTitle.setAttribute(
        "class",
        "axis-label"
    );

    yTitle.setAttribute(
        "transform",
        `rotate(-90 18 ${chartHeight / 2})`
    );

    yTitle.textContent =
        "Frequency";

    axisGroup.appendChild(yTitle);


    svg.appendChild(axisGroup);


    /*
        Update statistics.
    */

    updateStatistics(data);

}


/*
===========================================================
    CONTROLS
===========================================================
*/


/*
    Dataset changed
*/

datasetSelect.addEventListener(
    "change",
    drawHistogram
);


/*
    Slider changed
*/

binSizeSlider.addEventListener(
    "input",
    () => {

        const value =
            Number(binSizeSlider.value);

        binSizeNumber.value =
            value;

        binSizeDisplay.textContent =
            value;

        drawHistogram();

    }
);


/*
    Exact number changed
*/

binSizeNumber.addEventListener(
    "input",
    () => {

        const value =
            Number(binSizeNumber.value);


        if (
            Number.isFinite(value) &&
            value > 0
        ) {

            binSizeDisplay.textContent =
                formatNumber(value);


            /*
                Keep the slider approximately
                synchronized.

                The slider is only intended as
                a convenient control, while the
                number box allows arbitrary sizes.
            */

            if (
                value >=
                Number(binSizeSlider.min) &&
                value <=
                Number(binSizeSlider.max)
            ) {

                binSizeSlider.value =
                    value;

            }


            drawHistogram();

        }

    }
);


/*
===========================================================
    INITIAL DRAW
===========================================================
*/

drawHistogram();

</script>

</body>
</html>
